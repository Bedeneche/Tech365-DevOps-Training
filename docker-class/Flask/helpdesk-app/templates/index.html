
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Helpdesk Ticket System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Helpdesk Ticket System</h1>

        <!-- Create Ticket -->
        <section class="ticket-form">

            <h2>Create Ticket</h2>

            <form action="/create-ticket" method="POST">

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter user's name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="issue">Issue</label>

                    <textarea
                        id="issue"
                        name="issue"
                        placeholder="Describe the issue"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>

                    <select id="priority" name="priority">

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>
                </div>

                <button type="submit">
                    Create Ticket
                </button>

            </form>

        </section>


        <!-- Tickets -->
        <section>

            <h2>Tickets</h2>

            <div class="tickets">

                {% for ticket in tickets %}

                <div class="ticket">

                    <h3>
                        Ticket #{{ ticket.id }}
                    </h3>

                    <p>
                        <strong>Name:</strong>
                        {{ ticket.name }}
                    </p>

                    <p>
                        <strong>Issue:</strong>
                        {{ ticket.issue }}
                    </p>

                    <p>
                        <strong>Priority:</strong>

                        <span class="priority">
                            {{ ticket.priority }}
                        </span>
                    </p>

                    <p>
                        <strong>Status:</strong>
                        {{ ticket.status }}
                    </p>


                    <!-- Update Status -->
                    <form
                        class="status-form"
                        action="/update-status/{{ ticket.id }}"
                        method="POST"
                    >

                        <label for="status-{{ ticket.id }}">
                            Update Status
                        </label>

                        <select
                            id="status-{{ ticket.id }}"
                            name="status"
                        >

                            <option value="Open">
                                Open
                            </option>

                            <option value="In Progress">
                                In Progress
                            </option>

                            <option value="Resolved">
                                Resolved
                            </option>

                        </select>

                        <br><br>

                        <button type="submit">
                            Update Status
                        </button>

                    </form>


                    <!-- Delete Ticket -->
                    <form
                        class="delete-form"
                        action="/delete-ticket/{{ ticket.id }}"
                        method="POST"
                    >

                        <button
                            type="submit"
                            class="delete-button"
                        >
                            Delete Ticket
                        </button>

                    </form>

                </div>

                {% else %}

                <div class="ticket">

                    <p>
                        No tickets have been created yet.
                    </p>

                </div>

                {% endfor %}

            </div>

        </section>

    </div>

</body>

</html>
